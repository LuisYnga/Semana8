<h1 class="mb-3">Agregar estudiante</h1>
<div class="mb-3">
 <label class="form-label">Nombre</label>
 <input class="form-control" [(ngModel)]="nombre" name="nombre" />
</div>
<div class="mb-3">
 <label class="form-label">Créditos</label>
 <input type="number" class="form-control" [(ngModel)]="creditos" name="creditos" />
</div>
<button class="btn btn-primary" (click)="guardar()">Guardar</button>
<a class="btn btn-secondary ms-2" routerLink="/">Cancelar</a>
<p class="text-danger mt-3" *ngIf="mensaje">{{ mensaje }}</p>
